<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Backup Camera Overlay</title>

<style>
html, body {
    margin: 0;
    width:  100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

svg {
    width: 100%;
    height: 100%;
}

.guide {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    shape-rendering: geometricPrecision;
}

.green { stroke: #00ff00; }
.yellow { stroke: #ffd400; }
.red { stroke: #ff2b2b; }

</style>
</head>

<body>

<svg id="svg"></svg>

<script>

const svg = document.getElementById("svg");

// =========================
// GUIDELINES SCALING
// =========================

const WHEELBASE = 3;
const WIDTH = 8;

const STEP = 0.05;
const SCALING = 85;

const FOCAL_SCALING = 10.2;

const BOT_OFFSET = 40;

// section lengths / crossbar positions
const RED_LEN = 2.0;
const YELLOW_LEN = 2.5;
const GREEN_LEN = 3.0;

const SMOOTHING = 0.18;

// =========================
// FRAME OVERLAY
// =========================

const FRAME_PADDING = 40;       // distance from screen edges
const FRAME_STROKE = 16;        // thickness of the frame lines
const CORNER_RADIUS = 200;      // radius of the top corners of the frame
const PAD_CHANGE = 120;         // max distance from outermost to innermost position of a segment when detecting an object
const GAP = 32;                 // space in between lines

const FRAME_MAX = 4;
const FRAME_MIN = 1;

// =========================
// STATE
// =========================

let steering = 0;
let targetSteering = 0;
let distances = [3.9,3.9,3.9,3.9,3.9];

// =========================
// STEERING CALCULATIONS
// =========================

function steeringToDelta(steering) {
    const max = 30 * Math.PI / 180;
    const n = steering / 100;
    return Math.sign(n) * Math.pow(Math.abs(n), 0.65) * max;
}

function radius(delta) {
    if (Math.abs(delta) < 0.001) return Infinity;
    return WHEELBASE / Math.tan(delta);
}

// =========================
// CREATE CENTERLINE
// =========================

function buildCenterline(R, turnDir) {

    let x = 0;
    let y = 0;
    let h = -Math.PI / 2;

    const pts = [];
    const steps = Math.floor((RED_LEN + YELLOW_LEN + GREEN_LEN) / STEP);

    for (let i = 0; i < steps; i++) {

        // calculates the angle change before applying it to heading
        const dTheta = (STEP / R) * turnDir;
        h += dTheta;

        // use trig to find the change in x and y based on the heading
        x += Math.cos(h) * STEP;
        y += Math.sin(h) * STEP;

        pts.push({ x, y, h });
    }

    return pts;
}

// ============
// PROJECTION
// ============

function projectPoint(shiftedX, shiftedY, center) {

    const depth = Math.max(0, -shiftedY);

    const perspective = FOCAL_SCALING / (FOCAL_SCALING + depth);

    return {
        x: center.x + shiftedX * perspective * SCALING,
        y: center.y + shiftedY * perspective * SCALING
    };
}

function buildLane(centerline, center, offset, start, length) {

    let path = "";
    let acc = 0;
    let started = false;

    for (let i = 0; i < centerline.length; i++) {

        if (i > 0) {
            const dx = centerline[i].x - centerline[i - 1].x;
            const dy = centerline[i].y - centerline[i - 1].y;
            acc += Math.hypot(dx, dy);
        }

        if (acc < start) continue;
        if (acc > start + length) break;

        const p = centerline[i];

        const unitX = -Math.sin(p.h);
        const unitY = Math.cos(p.h);

        const shiftedX = p.x + unitX * offset;
        const shiftedY = p.y + unitY * offset;

        const proj = projectPoint(shiftedX, shiftedY, center);

        path += (started ? "L" : "M") + `${proj.x} ${proj.y} `;

        started = true;
    }

    return path;
}

function pointAtDistance(centerline, targetDist) {

    let acc = 0;

    for (let i = 1; i < centerline.length; i++) {

        const p0 = centerline[i - 1];
        const p1 = centerline[i];

        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;

        const segLen = Math.hypot(dx, dy);
        const dh = p1.h - p0.h;

        if (acc + segLen >= targetDist) {

            const t = (targetDist - acc) / segLen;

            return {
                x: p0.x + dx * t,
                y: p0.y + dy * t,
                h: p0.h + dh * t
            };
        }

        acc += segLen;
    }

    return centerline[centerline.length - 1];
}

function crossbar(p, center, offset, color) {

    const unitX = -Math.sin(p.h);
    const unitY = Math.cos(p.h);

    const left = projectPoint(
        p.x + unitX * -offset,
        p.y + unitY * -offset,
        center
    );

    const right = projectPoint(
        p.x + unitX * offset,
        p.y + unitY * offset,
        center
    );

    return `
        <line class="guide ${color}"
            x1="${left.x}" y1="${left.y}"
            x2="${right.x}" y2="${right.y}" />
    `;
}

// =========================
// DRAW
// =========================

function drawFrame(w, h, values) {

    const left = FRAME_PADDING;
    const right = w - FRAME_PADDING;
    const top = FRAME_PADDING;

    const midTop = top + CORNER_RADIUS;

    const [
        leftVal,
        curveLVal,
        topVal,
        curveRVal,
        rightVal    
    ] = values;

    const topI = getSegmentInfluence(topVal);
    const leftI = getSegmentInfluence(leftVal);
    const rightI = getSegmentInfluence(rightVal);
    const curveLI = getSegmentInfluence(curveLVal);
    const curveRI = getSegmentInfluence(curveRVal);

    return `
        <!-- TOP HORIZONTAL LINE -->
        <line x1="${left + CORNER_RADIUS + PAD_CHANGE * topI + GAP}" y1="${top + PAD_CHANGE * topI}"
              x2="${right - CORNER_RADIUS - PAD_CHANGE * topI - GAP}" y2="${top + PAD_CHANGE * topI}"
              stroke="${getSegmentColor(topVal)}"
              stroke-width="${FRAME_STROKE}"
              stroke-linecap="round" />

        <!-- LEFT VERTICAL LINE -->
        <line x1="${left + PAD_CHANGE * leftI}" y1="${midTop + PAD_CHANGE * leftI + GAP}"
              x2="${left + PAD_CHANGE * leftI}" y2="${h - FRAME_PADDING}"
              stroke="${getSegmentColor(leftVal)}"
              stroke-width="${FRAME_STROKE}"
              stroke-linecap="round" />

        <!-- RIGHT VERTICAL LINE -->
        <line x1="${right - PAD_CHANGE * rightI}" y1="${midTop + PAD_CHANGE * rightI + GAP}"
              x2="${right - PAD_CHANGE * rightI}" y2="${h - FRAME_PADDING}"
              stroke="${getSegmentColor(rightVal)}"
              stroke-width="${FRAME_STROKE}"
              stroke-linecap="round" />

        <!-- TOP LEFT CURVE -->
        <path d="
            M ${left + PAD_CHANGE * curveLI} ${midTop + PAD_CHANGE * curveLI}
            Q ${left + PAD_CHANGE * curveLI} ${top + PAD_CHANGE * curveLI} ${left + CORNER_RADIUS + PAD_CHANGE * curveLI} ${top + PAD_CHANGE * curveLI}
        "
        fill="none"
        stroke="${getSegmentColor(curveLVal)}"
        stroke-width="${FRAME_STROKE}"
        stroke-linecap="round" />

        <!-- TOP RIGHT CURVE -->
        <path d="
            M ${right - PAD_CHANGE * curveRI} ${midTop + PAD_CHANGE * curveRI}
            Q ${right - PAD_CHANGE * curveRI} ${top + PAD_CHANGE * curveRI} ${right - CORNER_RADIUS - PAD_CHANGE * curveRI} ${top + PAD_CHANGE * curveRI}
        "
        fill="none"
        stroke="${getSegmentColor(curveRVal)}"
        stroke-width="${FRAME_STROKE}"
        stroke-linecap="round" />
    `;
}

function getSegmentColor(value) {
    const RED = { r: 255, g: 0, b: 0 };
    const YELLOW = { r: 255, g: 255, b: 0 };
    const GREEN = { r: 0, g: 200, b: 0 }; // bright green (adjust if needed)
    const TRANSPARENT = {a: 0};

    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    function rgb(c) {
        return `rgb(${c.r | 0}, ${c.g | 0}, ${c.b | 0})`;
    }
    function rgba(c) {
        return `rgba(${c.r | 0}, ${c.g | 0}, ${c.b | 0}, ${c.a})`;
    }

    // clamp helpers
    if (value <= FRAME_MIN) return rgb(RED);
    if (value >= FRAME_MAX) return rgba(TRANSPARENT);

    // split into two segments:
    const mid = (FRAME_MIN + FRAME_MAX) / 2;

    if (value <= mid) {
        // red -> yellow
        const t = (value - FRAME_MIN) / (mid - FRAME_MIN);
        return rgb({
            r: lerp(RED.r, YELLOW.r, t),
            g: lerp(RED.g, YELLOW.g, t),
            b: lerp(RED.b, YELLOW.b, t)
        });
    } else {
        // yellow -> green
        const t = (value - mid) / (FRAME_MAX - mid);
        return rgb({
            r: lerp(YELLOW.r, GREEN.r, t),
            g: lerp(YELLOW.g, GREEN.g, t),
            b: lerp(YELLOW.b, GREEN.b, t)
        });
    }
}

function getSegmentInfluence(value) {
    // clamp + invert so:
    // 2 => 0 (no shrink)
    // 1 => 1 (max shrink)
    if (value >= FRAME_MAX) return 0;
    if (value <= FRAME_MIN) return 1;

    return (FRAME_MAX - value) / (FRAME_MAX - FRAME_MIN);
}

function updatePaths() {

    const w = window.innerWidth;
    const h = window.innerHeight;

    const center = {
        x: w / 2,
        y: h - BOT_OFFSET
    }

    const delta = steeringToDelta(steering);
    // turnDir has direction information, so the sign of R is redundant. Take absolute value to avoid double negatives
    const Rraw = Math.abs(radius(delta));
    const turnDir = delta >= 0 ? 1 : -1;

    const centerline = buildCenterline(Rraw, turnDir);

    const shift = WIDTH / 2;

    const L_red = buildLane(centerline, center, -shift, 0, RED_LEN);
    const L_yellow = buildLane(centerline, center, -shift, RED_LEN, YELLOW_LEN);
    const L_green = buildLane(centerline, center, -shift, RED_LEN + YELLOW_LEN, GREEN_LEN);

    const R_red = buildLane(centerline, center, shift, 0, RED_LEN);
    const R_yellow = buildLane(centerline, center, shift, RED_LEN, YELLOW_LEN);
    const R_green = buildLane(centerline, center, shift, RED_LEN + YELLOW_LEN, GREEN_LEN);

    let out = `
         ${drawFrame(w, h, distances)}

        <path class="guide green" d="${L_green}" />
        <path class="guide yellow" d="${L_yellow}" />
        <path class="guide red" d="${L_red}" />

        <path class="guide green" d="${R_green}" />
        <path class="guide yellow" d="${R_yellow}" />
        <path class="guide red" d="${R_red}" />
    `;

    const redP = pointAtDistance(centerline, RED_LEN);
    const yellowP = pointAtDistance(centerline, RED_LEN + YELLOW_LEN);
    const greenP = pointAtDistance(centerline, RED_LEN + YELLOW_LEN + GREEN_LEN);

    out += crossbar(redP, center, shift, "red");
    out += crossbar(yellowP, center, shift, "yellow");
    out += crossbar(greenP, center, shift, "green");

    svg.innerHTML = out;
}

// =========================
// LOOP
// =========================

function animate() {
    steering += (targetSteering - steering) * SMOOTHING;

    updatePaths();

    requestAnimationFrame(animate);
}

animate();

// =========================
// WEBSOCKET
// =========================

const wsController = new WebSocket("ws://127.0.0.1:8765");
const wsRealsense = new WebSocket("ws://127.0.0.1:8766");

wsController.onmessage = (event) => {

    const data = JSON.parse(event.data);

    if (data.type === "steering") {
        targetSteering = Math.max(-100, Math.min(100, data.angle));
    }
};
wsRealsense.onmessage = (event) => {

    const data = JSON.parse(event.data);

    if (data.type === "realsense") {
        distances = data.distances;
    }
};

</script>

</body>
</html>
