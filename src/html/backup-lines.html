<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Backup Camera Overlay</title>

<style>
html, body {
    margin: 0;
    width:  100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

svg {
    width: 100%;
    height: 100%;
}

.guide {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    shape-rendering: geometricPrecision;
}

.green { stroke: #00ff00; }
.yellow { stroke: #ffd400; }
.red { stroke: #ff2b2b; }

</style>
</head>

<body>

<svg id="svg"></svg>

<script>

const svg = document.getElementById("svg");

// =========================
// GUIDELINES SCALING
// =========================

const WHEELBASE = 3;
const WIDTH = 8;

const STEP = 0.05;
const SCALING = 85;

const FOCAL_SCALING = 10.2;

const BOT_OFFSET = 40;

// section lengths / crossbar positions
const RED_LEN = 2.0;
const YELLOW_LEN = 2.5;
const GREEN_LEN = 3.0;

const SMOOTHING = 0.18;

// =========================
// STATE
// =========================

let steering = 0;
let targetSteering = 0;

// =========================
// STEERING CALCULATIONS
// =========================

function steeringToDelta(steering) {
    const max = 30 * Math.PI / 180;
    const n = steering / 100;
    return Math.sign(n) * Math.pow(Math.abs(n), 0.65) * max;
}

function radius(delta) {
    if (Math.abs(delta) < 0.001) return Infinity;
    return WHEELBASE / Math.tan(delta);
}

// =========================
// CREATE CENTERLINE
// =========================

function buildCenterline(R, turnDir) {

    let x = 0;
    let y = 0;
    let h = -Math.PI / 2;

    const pts = [];
    const steps = Math.floor((RED_LEN + YELLOW_LEN + GREEN_LEN) / STEP);

    for (let i = 0; i < steps; i++) {

        // calculates the angle change before applying it to heading
        const dTheta = (STEP / R) * turnDir;
        h += dTheta;

        // use trig to find the change in x and y based on the heading
        x += Math.cos(h) * STEP;
        y += Math.sin(h) * STEP;

        pts.push({ x, y, h });
    }

    return pts;
}

// ============
// PROJECTION
// ============

function projectPoint(shiftedX, shiftedY, center) {

    const depth = Math.max(0, -shiftedY);

    const perspective = FOCAL_SCALING / (FOCAL_SCALING + depth);

    return {
        x: center.x + shiftedX * perspective * SCALING,
        y: center.y + shiftedY * perspective * SCALING
    };
}

function buildLane(centerline, center, offset, start, length) {

    let path = "";
    let acc = 0;
    let started = false;

    for (let i = 0; i < centerline.length; i++) {

        if (i > 0) {
            const dx = centerline[i].x - centerline[i - 1].x;
            const dy = centerline[i].y - centerline[i - 1].y;
            acc += Math.hypot(dx, dy);
        }

        if (acc < start) continue;
        if (acc > start + length) break;

        const p = centerline[i];

        const unitX = -Math.sin(p.h);
        const unitY = Math.cos(p.h);

        const shiftedX = p.x + unitX * offset;
        const shiftedY = p.y + unitY * offset;

        const proj = projectPoint(shiftedX, shiftedY, center);

        path += (started ? "L" : "M") + `${proj.x} ${proj.y} `;

        started = true;
    }

    return path;
}

function pointAtDistance(centerline, targetDist) {

    let acc = 0;

    for (let i = 1; i < centerline.length; i++) {

        const p0 = centerline[i - 1];
        const p1 = centerline[i];

        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;

        const segLen = Math.hypot(dx, dy);
        const dh = p1.h - p0.h;

        if (acc + segLen >= targetDist) {

            const t = (targetDist - acc) / segLen;

            return {
                x: p0.x + dx * t,
                y: p0.y + dy * t,
                h: p0.h + dh * t
            };
        }

        acc += segLen;
    }

    return centerline[centerline.length - 1];
}

function crossbar(p, center, offset, color) {

    const unitX = -Math.sin(p.h);
    const unitY = Math.cos(p.h);

    const left = projectPoint(
        p.x + unitX * -offset,
        p.y + unitY * -offset,
        center
    );

    const right = projectPoint(
        p.x + unitX * offset,
        p.y + unitY * offset,
        center
    );

    return `
        <line class="guide ${color}"
            x1="${left.x}" y1="${left.y}"
            x2="${right.x}" y2="${right.y}" />
    `;
}

function updatePaths() {

    const w = window.innerWidth;
    const h = window.innerHeight;

    const center = {
        x: w / 2,
        y: h - BOT_OFFSET
    }

    const delta = steeringToDelta(steering);
    // turnDir has direction information, so the sign of R is redundant. Take absolute value to avoid double negatives
    const Rraw = Math.abs(radius(delta));
    const turnDir = delta >= 0 ? 1 : -1;

    const centerline = buildCenterline(Rraw, turnDir);

    const shift = WIDTH / 2;

    const L_red = buildLane(centerline, center, -shift, 0, RED_LEN);
    const L_yellow = buildLane(centerline, center, -shift, RED_LEN, YELLOW_LEN);
    const L_green = buildLane(centerline, center, -shift, RED_LEN + YELLOW_LEN, GREEN_LEN);

    const R_red = buildLane(centerline, center, shift, 0, RED_LEN);
    const R_yellow = buildLane(centerline, center, shift, RED_LEN, YELLOW_LEN);
    const R_green = buildLane(centerline, center, shift, RED_LEN + YELLOW_LEN, GREEN_LEN);

    let out = `
        <path class="guide green" d="${L_green}" />
        <path class="guide yellow" d="${L_yellow}" />
        <path class="guide red" d="${L_red}" />

        <path class="guide green" d="${R_green}" />
        <path class="guide yellow" d="${R_yellow}" />
        <path class="guide red" d="${R_red}" />
    `;

    const redP = pointAtDistance(centerline, RED_LEN);
    const yellowP = pointAtDistance(centerline, RED_LEN + YELLOW_LEN);
    const greenP = pointAtDistance(centerline, RED_LEN + YELLOW_LEN + GREEN_LEN);

    out += crossbar(redP, center, shift, "red");
    out += crossbar(yellowP, center, shift, "yellow");
    out += crossbar(greenP, center, shift, "green");

    svg.innerHTML = out;
}

// =========================
// LOOP
// =========================

function animate() {
    steering += (targetSteering - steering) * SMOOTHING;

    updatePaths();

    requestAnimationFrame(animate);
}

animate();

// =========================
// WEBSOCKET
// =========================

const wsController = new WebSocket("ws://127.0.0.1:8765");

wsController.onmessage = (event) => {

    const data = JSON.parse(event.data);

    if (data.type === "steering") {
        targetSteering = Math.max(-100, Math.min(100, data.angle));
    }
};

</script>

</body>
</html>
