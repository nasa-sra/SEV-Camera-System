<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Backup Camera Overlay</title>

<style>
html, body {
    margin: 0;
    width:  100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

svg {
    width: 100%;
    height: 100%;
}

.guide {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    shape-rendering: geometricPrecision;
}

.green { stroke: #00ff00; }
.yellow { stroke: #ffd400; }
.red { stroke: #ff2b2b; }
</style>
</head>

<body>

<svg id="svg"></svg>

<script>

const svg = document.getElementById("svg");

// =========================
// VEHICLE MODEL
// =========================

const L = 0.8;
const W = 6.5;

const PIXELS_PER_METER = 85;
const FOCAL_LENGTH = 10.2;
const CAMERA_HEIGHT = 0.2;

const STEP = 0.18;
const PATH_LENGTH = 6.5;

// zones
const RED_LEN = 2.2;
const YELLOW_LEN = 4.5;
const GREEN_LEN = 7.5;

// =========================
// FRAME OVERLAY
// =========================

const FRAME_PADDING = 40;      // distance from screen edges
const FRAME_STROKE = 16;        // thickness
const CORNER_RADIUS = 140;      // curvature size

const FRAME_COLOR = "#00ffff"; // easy to change later

// =========================
// STATE
// =========================

let steering = 0;
let targetSteering = 0;
let distances = [2,2,2,2,2];

let lastTime = performance.now();

// =========================
// STEERING MODEL
// =========================

function steeringToDelta(sas) {
    const max = 15 * Math.PI / 180;
    const n = sas / 100;
    return Math.sign(n) * Math.pow(Math.abs(n), 0.65) * max;
}

function radius(delta) {
    if (Math.abs(delta) < 0.001) return Infinity;
    return L / Math.tan(delta);
}

// =========================
// CENTER PATH (FIXED INTEGRATION)
// =========================

function buildCenterline(R, turnDir) {

    let x = 0;
    let y = 0;
    let h = -Math.PI / 2;

    const pts = [];
    const steps = Math.floor(PATH_LENGTH / STEP);

    for (let i = 0; i < steps; i++) {

        // arc-consistent heading update
        const dTheta = (STEP / R) * turnDir;
        h += dTheta;

        // integrate along updated heading (fixes drift + curvature instability)
        x += Math.cos(h) * STEP;
        y += Math.sin(h) * STEP;

        pts.push({ x, y, h });
    }

    return pts;
}

// =========================
// PROJECTION (FIXED: FULL PERSPECTIVE)
// =========================

function projectPoint(wx, wy, cx, cy) {

    const depth = Math.max(0, -wy);

    const perspective =
        FOCAL_LENGTH / (FOCAL_LENGTH + depth);

    return {
        x: cx + wx * perspective * PIXELS_PER_METER,
        y: cy + wy * perspective * PIXELS_PER_METER
    };
}

// =========================
// OFFSET + TRIM PATH
// =========================

function buildLane(points, cx, cy, offset, maxDist) {

    let path = "";
    let acc = 0;

    for (let i = 0; i < points.length; i++) {

        if (i > 0) {
            const dx = points[i].x - points[i - 1].x;
            const dy = points[i].y - points[i - 1].y;
            acc += Math.hypot(dx, dy);
        }

        if (acc > maxDist) break;

        const p = points[i];

        const nx = -Math.sin(p.h);
        const ny = Math.cos(p.h);

        const worldX = p.x + nx * offset;
        const worldY = p.y + ny * offset;

        const proj = projectPoint(worldX, worldY, cx, cy);

        path += (i === 0 ? "M" : "L") + `${proj.x} ${proj.y} `;
    }

    return path;
}

// =========================
// POINT AT DISTANCE
// =========================

function pointAtDistance(points, targetDist) {

    let acc = 0;

    for (let i = 1; i < points.length; i++) {

        const p0 = points[i - 1];
        const p1 = points[i];

        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;

        const segLen = Math.sqrt(dx * dx + dy * dy);

        if (acc + segLen >= targetDist) {

            const t = (targetDist - acc) / segLen;

            return {
                x: p0.x + dx * t,
                y: p0.y + dy * t,
                h: p0.h + (p1.h - p0.h) * t
            };
        }

        acc += segLen;
    }

    return points[points.length - 1];
}

// =========================
// CROSSBAR
// =========================

function crossbar(p, cx, cy, offset, color) {

    const nx = -Math.sin(p.h);
    const ny = Math.cos(p.h);

    const left = projectPoint(
        p.x + nx * -offset,
        p.y + ny * -offset,
        cx,
        cy
    );

    const right = projectPoint(
        p.x + nx * offset,
        p.y + ny * offset,
        cx,
        cy
    );

    return `
        <line class="guide ${color}"
            x1="${left.x}" y1="${left.y}"
            x2="${right.x}" y2="${right.y}" />
    `;
}

// =========================
// DRAW
// =========================

function drawFrame(w, h, values) {

    const left = FRAME_PADDING;
    const right = w - FRAME_PADDING;
    const top = FRAME_PADDING;

    const midTop = top + CORNER_RADIUS;

    const [
        leftVal,
        curveLVal,
        topVal,
        curveRVal,
        rightVal    
    ] = values;

    const topI = getSegmentInfluence(topVal);
    const leftI = getSegmentInfluence(leftVal);
    const rightI = getSegmentInfluence(rightVal);
    const curveLI = getSegmentInfluence(curveLVal);
    const curveRI = getSegmentInfluence(curveRVal);

    // inward contraction amount (tunable)
    const MAX_PAD = 120;

    // space in between lines
    const GAP = 32;

    return `
        <!-- TOP HORIZONTAL LINE -->
        <line x1="${left + CORNER_RADIUS + MAX_PAD * topI + GAP}" y1="${top + MAX_PAD * topI}"
              x2="${right - CORNER_RADIUS - MAX_PAD * topI - GAP}" y2="${top + MAX_PAD * topI}"
              stroke="${getSegmentColor(topVal)}"
              stroke-width="${FRAME_STROKE}"
              stroke-linecap="round" />

        <!-- LEFT VERTICAL LINE -->
        <line x1="${left + MAX_PAD * leftI}" y1="${midTop + MAX_PAD * leftI + GAP}"
              x2="${left + MAX_PAD * leftI}" y2="${h - FRAME_PADDING}"
              stroke="${getSegmentColor(leftVal)}"
              stroke-width="${FRAME_STROKE}"
              stroke-linecap="round" />

        <!-- RIGHT VERTICAL LINE -->
        <line x1="${right - MAX_PAD * rightI}" y1="${midTop + MAX_PAD * rightI + GAP}"
              x2="${right - MAX_PAD * rightI}" y2="${h - FRAME_PADDING}"
              stroke="${getSegmentColor(rightVal)}"
              stroke-width="${FRAME_STROKE}"
              stroke-linecap="round" />

        <!-- TOP LEFT CURVE -->
        <path d="
            M ${left + MAX_PAD * curveLI} ${midTop + MAX_PAD * curveLI}
            Q ${left + MAX_PAD * curveLI} ${top + MAX_PAD * curveLI} ${left + CORNER_RADIUS + MAX_PAD * curveLI} ${top + MAX_PAD * curveLI}
        "
        fill="none"
        stroke="${getSegmentColor(curveLVal)}"
        stroke-width="${FRAME_STROKE}"
        stroke-linecap="round" />

        <!-- TOP RIGHT CURVE -->
        <path d="
            M ${right - MAX_PAD * curveRI} ${midTop + MAX_PAD * curveRI}
            Q ${right - MAX_PAD * curveRI} ${top + MAX_PAD * curveRI} ${right - CORNER_RADIUS - MAX_PAD * curveRI} ${top + MAX_PAD * curveRI}
        "
        fill="none"
        stroke="${getSegmentColor(curveRVal)}"
        stroke-width="${FRAME_STROKE}"
        stroke-linecap="round" />
    `;
}

function getSegmentColor(value) {

    // adjustable thresholds
    const MIN = 1;   // below this = red
    const MAX = 2;   // above this = green

    const RED = { r: 255, g: 0, b: 0 };
    const YELLOW = { r: 255, g: 255, b: 0 };
    const GREEN = { r: 0, g: 200, b: 0 }; // bright green (adjust if needed)

    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    function rgb(c) {
        return `rgb(${c.r | 0}, ${c.g | 0}, ${c.b | 0})`;
    }

    // clamp helpers
    if (value <= MIN) return rgb(RED);
    if (value >= MAX) return rgb(GREEN);

    // split into two segments:
    const mid = (MIN + MAX) / 2;

    if (value <= mid) {
        // red -> yellow
        const t = (value - MIN) / (mid - MIN);
        return rgb({
            r: lerp(RED.r, YELLOW.r, t),
            g: lerp(RED.g, YELLOW.g, t),
            b: lerp(RED.b, YELLOW.b, t)
        });
    } else {
        // yellow -> green
        const t = (value - mid) / (MAX - mid);
        return rgb({
            r: lerp(YELLOW.r, GREEN.r, t),
            g: lerp(YELLOW.g, GREEN.g, t),
            b: lerp(YELLOW.b, GREEN.b, t)
        });
    }
}

function getSegmentInfluence(value) {

    const MIN = 1;
    const MAX = 2;

    // clamp + invert so:
    // 2 => 0 (no shrink)
    // 1 => 1 (max shrink)
    if (value >= MAX) return 0;
    if (value <= MIN) return 1;

    return (MAX - value) / (MAX - MIN);
}

function updatePaths() {

    const w = window.innerWidth;
    const h = window.innerHeight;

    const cx = w / 2;
    const cy = h;

    const delta = steeringToDelta(steering);
    const Rraw = radius(delta);
    const turnDir = delta >= 0 ? 1 : -1;

    const centerline = buildCenterline(
        Math.max(2.5, Math.abs(Rraw)),
        turnDir
    );

    const half = W / 2;

    const L_green = buildLane(centerline, cx, cy, -half, GREEN_LEN);
    const L_yellow = buildLane(centerline, cx, cy, -half, YELLOW_LEN);
    const L_red = buildLane(centerline, cx, cy, -half, RED_LEN);

    const R_green = buildLane(centerline, cx, cy, half, GREEN_LEN);
    const R_yellow = buildLane(centerline, cx, cy, half, YELLOW_LEN);
    const R_red = buildLane(centerline, cx, cy, half, RED_LEN);

    let out = `
        ${drawFrame(w, h, distances)}

        <path class="guide green" d="${L_green}" />
        <path class="guide yellow" d="${L_yellow}" />
        <path class="guide red" d="${L_red}" />

        <path class="guide green" d="${R_green}" />
        <path class="guide yellow" d="${R_yellow}" />
        <path class="guide red" d="${R_red}" />
    `;

    const redP = pointAtDistance(centerline, RED_LEN);
    const yellowP = pointAtDistance(centerline, YELLOW_LEN);
    const greenP = pointAtDistance(centerline, GREEN_LEN);

    out += crossbar(redP, cx, cy, half, "red");
    out += crossbar(yellowP, cx, cy, half, "yellow");
    out += crossbar(greenP, cx, cy, half, "green");

    svg.innerHTML = out;
}

// =========================
// LOOP
// =========================

function animate(now) {
    lastTime = now;
    steering += (targetSteering - steering) * 0.3;

    updatePaths();

    requestAnimationFrame(animate);
}

animate();

// =========================
// WEBSOCKET
// =========================

const wsController = new WebSocket("ws://127.0.0.1:8765");
const wsRealsense = new WebSocket("ws://127.0.0.1:8766");

wsController.onmessage = (event) => {

    const data = JSON.parse(event.data);

    if (data.type === "steering") {
        targetSteering = Math.max(-100, Math.min(100, data.angle));
    }
};
wsRealsense.onmessage = (event) => {

    const data = JSON.parse(event.data);

    if (data.type === "realsense") {
        distances = data.distances;
    }
};

</script>

</body>
</html>
