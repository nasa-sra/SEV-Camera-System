<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Backup Camera Overlay</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

svg {
    width: 100%;
    height: 100%;
}

.guide {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;

    /* 🔥 stabilizes anti-aliasing flicker */
    shape-rendering: geometricPrecision;
}

.green { stroke: #00ff00; }
.yellow { stroke: #ffd400; }
.red { stroke: #ff2b2b; }
</style>
</head>

<body>

<svg id="svg"></svg>

<script>

const svg = document.getElementById("svg");

// =========================
// VEHICLE MODEL
// =========================

const L = 2.7;
const W = 4;
const SCALE = 60;

const STEP = 0.18;
const PATH_LENGTH = 8.5;

// zone lengths
const RED_LEN = 2.2;
const YELLOW_LEN = 4.5;
const GREEN_LEN = 7.5;

// 🔥 tiny deterministic separation to prevent overlap flicker
const YELLOW_INSET = 0.015;

// =========================
// STATE
// =========================

let steering = 0;
let targetSteering = 0;

// =========================
// STEERING MODEL
// =========================

function steeringToDelta(sas) {
    const max = 35 * Math.PI / 180;
    const n = sas / 100;
    return Math.sign(n) * Math.pow(Math.abs(n), 0.65) * max;
}

function radius(delta) {
    if (Math.abs(delta) < 0.001) return Infinity;
    return L / Math.tan(delta);
}

// =========================
// CENTER PATH
// =========================

function buildCenterline(R, turnDir) {

    let x = 0;
    let y = 0;
    let h = -Math.PI / 2;

    const pts = [];
    const steps = Math.floor(PATH_LENGTH / STEP);

    for (let i = 0; i < steps; i++) {

        const vx = Math.cos(h);
        const vy = Math.sin(h);

        x += vx * STEP;
        y += vy * STEP;

        if (R !== Infinity) {
            h += (STEP / R) * turnDir;
        }

        pts.push({ x, y, h });
    }

    return pts;
}

// =========================
// OFFSET + TRIM PATH
// =========================

function buildLane(points, cx, cy, offset, maxDist) {

    let path = "";
    let acc = 0;

    for (let i = 0; i < points.length; i++) {

        if (i > 0) {
            const dx = points[i].x - points[i - 1].x;
            const dy = points[i].y - points[i - 1].y;
            acc += Math.sqrt(dx * dx + dy * dy);
        }

        if (acc > maxDist) break;

        const p = points[i];

        const nx = -Math.sin(p.h);
        const ny = Math.cos(p.h);

        let o = offset;

        // 🔥 subtle bias ONLY for yellow system (passed via offset sign)
        const px = cx + (p.x + nx * o) * SCALE;
        const py = cy + (p.y + ny * o) * SCALE;

        path += (i === 0 ? "M" : "L") + `${px} ${py} `;
    }

    return path;
}

// =========================
// POINT AT DISTANCE
// =========================

function pointAtDistance(points, targetDist) {

    let acc = 0;

    for (let i = 1; i < points.length; i++) {

        const p0 = points[i - 1];
        const p1 = points[i];

        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;

        const segLen = Math.sqrt(dx * dx + dy * dy);

        if (acc + segLen >= targetDist) {

            const t = (targetDist - acc) / segLen;

            return {
                x: p0.x + dx * t,
                y: p0.y + dy * t,
                h: p0.h + (p1.h - p0.h) * t
            };
        }

        acc += segLen;
    }

    return points[points.length - 1];
}

// =========================
// CROSSBAR
// =========================

function crossbar(p, cx, cy, offset, color) {

    const nx = -Math.sin(p.h);
    const ny = Math.cos(p.h);

    const leftX  = cx + (p.x + nx * -offset) * SCALE;
    const leftY  = cy + (p.y + ny * -offset) * SCALE;

    const rightX = cx + (p.x + nx * offset) * SCALE;
    const rightY = cy + (p.y + ny * offset) * SCALE;

    return `<line class="guide ${color}"
        x1="${leftX}" y1="${leftY}"
        x2="${rightX}" y2="${rightY}" />`;
}

// =========================
// DRAW
// =========================

function updatePaths() {

    const w = window.innerWidth;
    const h = window.innerHeight;

    const cx = w / 2;
    const cy = h;

    svg.innerHTML = "";

    const delta = steeringToDelta(steering);
    const Rraw = radius(delta);
    const turnDir = delta >= 0 ? 1 : -1;

    const centerline = buildCenterline(
        Math.max(2.5, Math.abs(Rraw)),
        turnDir
    );

    const half = W / 2;

    // =========================
    // DRAW ORDER FIX (GREEN FIRST)
    // =========================

    const L_green  = buildLane(centerline, cx, cy, -half, GREEN_LEN);
    const L_yellow = buildLane(centerline, cx, cy, -half + YELLOW_INSET, YELLOW_LEN);
    const L_red    = buildLane(centerline, cx, cy, -half, RED_LEN);

    const R_green  = buildLane(centerline, cx, cy,  half, GREEN_LEN);
    const R_yellow = buildLane(centerline, cx, cy,  half - YELLOW_INSET, YELLOW_LEN);
    const R_red    = buildLane(centerline, cx, cy,  half, RED_LEN);

    let out = `

        <!-- LEFT SIDE -->
        <path class="guide green"  d="${L_green}" />
        <path class="guide yellow" d="${L_yellow}" />
        <path class="guide red"    d="${L_red}" />

        <!-- RIGHT SIDE -->
        <path class="guide green"  d="${R_green}" />
        <path class="guide yellow" d="${R_yellow}" />
        <path class="guide red"    d="${R_red}" />

    `;

    const redP    = pointAtDistance(centerline, RED_LEN);
    const yellowP = pointAtDistance(centerline, YELLOW_LEN);
    const greenP  = pointAtDistance(centerline, GREEN_LEN);

    out += crossbar(redP, cx, cy, half, "red");
    out += crossbar(yellowP, cx, cy, half, "yellow");
    out += crossbar(greenP, cx, cy, half, "green");

    svg.innerHTML = out;
}

// =========================
// LOOP
// =========================

function animate() {

    steering += (targetSteering - steering) * 0.18;

    updatePaths();

    requestAnimationFrame(animate);
}

animate();

// =========================
// WEBSOCKET
// =========================

const ws = new WebSocket("ws://127.0.0.1:8765");

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === "steering") {
        targetSteering = Math.max(-100, Math.min(100, data.angle));
    }
};

</script>

</body>
</html>
